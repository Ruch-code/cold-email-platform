name: Deploy to Netlify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Trigger Netlify production deploy
        run: |
          curl -s -X POST "${{ secrets.NETLIFY_BUILD_WEBHOOK }}" | jq -r '. || "queued"'